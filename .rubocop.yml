# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# RBS inline signatures are written as `#:` with no space. Without this, RuboCop
# autocorrects them to `# :` and rbs-inline stops recognizing them.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

# Generated from the inline annotations — not ours to style.
AllCops:
  Exclude:
    - sig/**/*
