        statement_hint: "Markdown. Especifique exatamente o formato de entrada e de saída, e termine sempre pela seção \"Como ler a entrada\", com as linhas de Python que capturam a entrada deste problema."
        statement_template: |-
          Descreva o problema em uma ou duas frases.

          ## Entrada

          Diga exatamente o que chega pela entrada padrão.

          ## Saída

          Diga exatamente o que deve ser impresso.

          ## Exemplo

          Para a entrada

          ```
          1 2 3
          ```

          a saída é

          ```
          6
          ```

          ## Como ler a entrada

          A entrada chega pronta pela entrada padrão. Não peça nada ao usuário.

          ```
          numeros = input().split()          # ["1", "2", "3"]
          numeros = [ int(n) for n in numeros ]
          ```
