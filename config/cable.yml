# Development mirrors production: jobs run in a separate process (bin/jobs), and the
# async adapter never crosses process boundaries — verdicts judged there would never
# reach the browser.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
